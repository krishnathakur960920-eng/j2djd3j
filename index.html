<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#020005">
    <title>Do You Love Me? ❤️</title>
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&family=Plus+Jakarta+Sans:wght@300;400;600;800&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Plus Jakarta Sans', 'sans-serif'],
                        serif: ['Dancing Script', 'cursive'],
                    }
                }
            }
        }
    </script>
    <link rel="stylesheet" href="style.css">
</head>
<body class="app-body bg-[#020005] text-white overflow-hidden flex items-center justify-center relative selection:bg-pink-500 selection:text-white">

    <!-- Background glow + floating particles -->
    <div class="absolute inset-0 overflow-hidden pointer-events-none z-0">
        <div class="absolute top-[-20%] left-[-20%] w-[90vmin] h-[90vmin] bg-pink-500/10 rounded-full blur-[100px]"></div>
        <div class="absolute bottom-[-20%] right-[-20%] w-[90vmin] h-[90vmin] bg-purple-500/10 rounded-full blur-[100px]"></div>
        <div id="particles" class="absolute inset-0"></div>
    </div>

    <!-- Dark vignette that sits behind the 3D heart -->
    <div id="climax-bg" class="hidden-state"></div>

    <!-- 3D heart canvas -->
    <canvas id="c" class="absolute inset-0 w-full h-full z-10 pointer-events-none hidden-state"></canvas>

    <!-- Question -->
    <div id="question-screen" class="z-20 relative flex flex-col items-center text-center">
        <div id="cute-heart" class="q-emoji">🥺</div>
        <h1 class="question-title">Do you love me?</h1>
        <div class="answer-row">
            <button id="yesBtn" class="answer-btn yes-btn">Yes</button>
            <button id="noBtn" class="answer-btn no-btn">No</button>
        </div>
    </div>

    <!-- After "Yes" -->
    <div id="climax-screen" class="absolute inset-0 z-20 hidden-state">
        <div id="love-bg-text" class="select-none">
            <h2 class="love-title">I Love You</h2>
            <h2 class="love-sub">forever &amp; always</h2>
        </div>

        <div id="envelope-trigger" class="group">
            <div class="envelope-float">
                <div class="envelope-icon">
                    <div class="envelope-flap"></div>
                    <div class="envelope-heart animate-pulse">❤️</div>
                </div>
                <span class="envelope-label animate-pulse">Open Secret Letter</span>
            </div>
        </div>
    </div>

    <!-- Letter -->
    <div id="letter-overlay" class="fixed inset-0 z-50 bg-black/60 backdrop-blur-md flex items-center justify-center p-3 hidden-state">
        <div id="letter-box" class="letter-box-size bg-white text-gray-900 rounded-3xl p-6 sm:p-8 shadow-[0_25px_60px_-15px_rgba(0,0,0,0.5)] border border-pink-100 flex flex-col relative transform translate-y-32 scale-95">
            <div class="absolute -top-4 left-1/2 -translate-x-1/2 w-10 h-10 bg-rose-500 rounded-full flex items-center justify-center text-white text-base border-2 border-white shadow-md">
                ❤️
            </div>
            <h3 class="text-3xl font-serif text-rose-600 mb-4 text-center border-b border-rose-100 pb-2">For You 💌</h3>
            <div id="letter-text" class="space-y-3 font-sans text-sm sm:text-base text-gray-700 leading-relaxed min-h-[120px]"></div>
            <div id="letter-signature" class="mt-6 text-right border-t border-rose-100 pt-4 opacity-0 transform translate-y-4">
                <span class="text-xs text-gray-400 block">Forever Yours,</span>
                <span class="text-3xl font-serif text-rose-600 block mt-1">Krish</span>
            </div>
            <button id="closeBtn" class="mt-6 px-6 py-3 bg-rose-50 hover:bg-rose-100 border border-rose-100 rounded-full text-rose-600 font-semibold text-sm transition-all hover:scale-105 w-full">
                Close Letter
            </button>
        </div>
    </div>

    <audio id="bgMusic" loop>
        <source src="https://cdn.pixabay.com/audio/2022/05/16/audio_03d9db3073.mp3" type="audio/mpeg">
    </audio>

    <canvas id="confetti-canvas" class="absolute inset-0 pointer-events-none z-40"></canvas>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <script src="script.js"></script>
</body>
</html>
